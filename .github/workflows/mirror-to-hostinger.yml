name: Espelhar main para vinc-site-hostinger

# O Hostinger publica o site direto do repositório vinc-site-hostinger.
# Este workflow mantém a branch main desse repositório sempre idêntica
# à main deste (vinc-site), toda vez que houver um push aqui.
#
# O `git push --force` abaixo é intencional: o repositório de destino é só um espelho
# gerado (o conteúdo vem das páginas estáticas e arquivos gerados no próprio job), então
# o main dele deve ser sempre sobrescrito. Não faça commits direto nele.
#
# As Actions estão fixadas por SHA de commit (a tag fica no comentário) para que uma tag
# movida ou comprometida não altere o deploy, que tem acesso à chave SSH. Para atualizar:
#   git ls-remote https://github.com/<dono>/<repo> 'refs/tags/<versão>*'
# e troque o SHA e o comentário.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Histórico completo. O push do espelho precisa enviar todo commit que o destino ainda não
          # tem. Com o clone raso padrão (fetch-depth: 1), um merge commit, cujo 2º pai o espelho nunca
          # recebeu, é rejeitado: "remote: fatal: did not receive expected object <sha do 2º pai>".
          fetch-depth: 0

      # A ordem importa: as páginas estáticas (blog/) são geradas primeiro; o pacote de artigos e o
      # sitemap passam a apontar para elas quando existem.
      - name: Gerar páginas estáticas dos artigos (blog/<slug>.html)
        run: |
          node --version
          node scripts/build-articles.mjs --rewrite-links

      - name: Gerar content/posts.json (pacote único dos artigos do blog)
        run: python3 scripts/build-posts.py

      - name: Gerar sitemap.xml (páginas + artigos, com lastmod dos artigos)
        run: python3 scripts/build-sitemap.py

      - name: Carregar chave SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIRROR_DEPLOY_KEY }}

      - name: Confiar no host do GitHub
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Espelhar para vinc-site-hostinger (sem .github, scripts e package.json, que são só deste repositório)
        run: |
          rm -rf .github scripts package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f content/posts.json sitemap.xml blog   # gerados acima; ignorados no .gitignore deste repositório
          git commit -m "Mirror de vinc-site@${GITHUB_SHA}" --allow-empty
          git remote add hostinger git@github.com:luizgteixeira/vinc-site-hostinger.git
          git push --force hostinger HEAD:main
