name: Espelhar main para vinc-site-hostinger

# O Hostinger publica o site direto do repositório vinc-site-hostinger.
# Este workflow mantém a branch main desse repositório sempre idêntica
# à main deste (vinc-site), toda vez que houver um push aqui.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar content/posts.json (pacote único dos artigos do blog)
        run: python3 scripts/build-posts.py

      - name: Gerar sitemap.xml (páginas + artigos, com lastmod dos artigos)
        run: python3 scripts/build-sitemap.py

      - name: Carregar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIRROR_DEPLOY_KEY }}

      - name: Confiar no host do GitHub
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Espelhar para vinc-site-hostinger (sem .github e scripts, que são só deste repositório)
        run: |
          rm -rf .github scripts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f content/posts.json sitemap.xml   # gerados acima; ignorados no .gitignore deste repositório
          git commit -m "Mirror de vinc-site@${GITHUB_SHA}" --allow-empty
          git remote add hostinger git@github.com:luizgteixeira/vinc-site-hostinger.git
          git push --force hostinger HEAD:main
